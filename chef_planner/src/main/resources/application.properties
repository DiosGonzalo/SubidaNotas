spring.application.name=chef_planner
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false
spring.profiles.active=dev,s3

# JWT
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationThatNeedsToBeAtLeast256BitsLong
jwt.duration=86400

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB



minio.bucket.name= chefplanner

# Error
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always
